services:
  analysis-store-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analysis-store-service
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://analysis_store:analysis_store@postgres:5432/analysis_store
      RABBITMQ_URL: amqp://app:change_me@rabbitmq:5672
    ports:
      - '3001:3001'
    depends_on:
      analysis-store-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analysis-store-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analysis-store-migrate
    command: ['npm', 'run', 'db:migrate']
    restart: 'no'
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://analysis_store:analysis_store@postgres:5432/analysis_store
      RABBITMQ_URL: amqp://app:change_me@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: analysis-store-postgres
    environment:
      POSTGRES_USER: analysis_store
      POSTGRES_PASSWORD: analysis_store
      POSTGRES_DB: analysis_store
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U analysis_store -d analysis_store']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: analysis-store-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: change_me
    ports:
      - '${RABBITMQ_AMQP_HOST_PORT:-5673}:5672'
      - '${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
