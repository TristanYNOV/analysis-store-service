name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run standard tests
        run: npm test -- --runInBand

  test-e2e:
    name: Tests E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analysis_store
          POSTGRES_PASSWORD: analysis_store
          POSTGRES_DB: analysis_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analysis_store -d analysis_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://analysis_store:analysis_store@localhost:5432/analysis_store
      MASTER_KEY: test-master-key
      CRYPTO_KEY_VERSION: v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate migrations
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand
